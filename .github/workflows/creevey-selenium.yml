name: Creevey Screenshot Tests - Selenium Grid

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  # SB8 Projects (Node 20, npm 10.9.7)
  sb8-selenium-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - fixture: cjs-webpack-sb8
            node-version: '20'
            package-manager: npm
            package-manager-version: '10.9.7'
          - fixture: cjs-vite-sb8
            node-version: '20'
            package-manager: npm
            package-manager-version: '10.9.7'
          - fixture: esm-webpack-sb8
            node-version: '20'
            package-manager: npm
            package-manager-version: '10.9.7'
          - fixture: esm-vite-sb8
            node-version: '20'
            package-manager: npm
            package-manager-version: '10.9.7'
    uses: ./.github/workflows/selenium-template.yml
    with:
      fixture: ${{ matrix.fixture }}
      node-version: ${{ matrix.node-version }}
      package-manager: ${{ matrix.package-manager }}
      package-manager-version: ${{ matrix.package-manager-version }}

  # SB9 Projects (Node 22, npm 10.9.7)
  sb9-selenium-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - fixture: esm-vite-sb9
            node-version: '22'
            package-manager: npm
            package-manager-version: '10.9.7'
          - fixture: esm-vite-sb9-playwright
            node-version: '22'
            package-manager: npm
            package-manager-version: '10.9.7'
    uses: ./.github/workflows/selenium-template.yml
    with:
      fixture: ${{ matrix.fixture }}
      node-version: ${{ matrix.node-version }}
      package-manager: ${{ matrix.package-manager }}
      package-manager-version: ${{ matrix.package-manager-version }}

  # SB9 Package Manager Variants (Node 22)
  sb9-package-variants:
    strategy:
      fail-fast: false
      matrix:
        include:
          - fixture: esm-vite-sb9-pnpm
            node-version: '22'
            package-manager: pnpm
            package-manager-version: '9.15.9'
          - fixture: esm-vite-sb9-yarn-pnp
            node-version: '22'
            package-manager: yarn
            package-manager-version: '4.13.0'
    uses: ./.github/workflows/selenium-template.yml
    with:
      fixture: ${{ matrix.fixture }}
      node-version: ${{ matrix.node-version }}
      package-manager: ${{ matrix.package-manager }}
      package-manager-version: ${{ matrix.package-manager-version }}

  # SB10 Project (Node 24, npm 10.9.7)
  sb10-selenium-tests:
    uses: ./.github/workflows/selenium-template.yml
    with:
      fixture: esm-vite-sb10
      node-version: '24'
      package-manager: npm
      package-manager-version: '10.9.7'
