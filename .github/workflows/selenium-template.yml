name: Selenium Test Template

on:
  workflow_call:
    inputs:
      fixture:
        required: true
        type: string
        description: 'Project directory name'
      node-version:
        required: true
        type: string
        description: 'Node.js version (20, 22, or 24)'
      package-manager:
        required: true
        type: string
        description: 'Package manager (npm, pnpm, yarn)'
      package-manager-version:
        required: false
        type: string
        description: 'Package manager version (e.g., 10.9.7, 9.15.9, 4.13.0)'
      creevey-extra-args:
        required: false
        type: string
        default: ''
        description: 'Additional arguments to pass to the creevey script'
      creevey-report-dir:
        required: false
        type: string
        default: 'report'
        description: 'Report directory to upload after the run'
      capture-creevey-exit-code:
        required: false
        type: boolean
        default: false
        description: 'Capture Creevey exit code without failing the step'
      junit-scenario:
        required: false
        type: string
        default: ''
        description: 'Expected JUnit scenario for XML validation'
      junit-summary-label:
        required: false
        type: string
        default: ''
        description: 'Summary label for JUnit validation output'
      inject-button-mismatch:
        required: false
        type: boolean
        default: false
        description: 'Change the Button story label to force a mismatch'
      artifact-suffix:
        required: false
        type: string
        default: ''
        description: 'Suffix appended to uploaded artifact names'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      selenium-hub:
        image: selenium/hub:4.28.0-20250120
        ports:
          - 4444:4444
          - 4442:4442
          - 4443:4443
        env:
          GRID_MAX_SESSION: 16
          GRID_TIMEOUT: 30000
          GRID_BROWSER_TIMEOUT: 30000
        options: >-
          --health-cmd "curl -f http://localhost:4444/wd/hub/status || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      selenium-node-chrome:
        image: selenium/node-chrome:4.28.0-20250120
        env:
          SE_EVENT_BUS_HOST: selenium-hub
          SE_EVENT_BUS_PUBLISH_PORT: 4442
          SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
          SE_NODE_MAX_SESSIONS: 4
          SE_NODE_OVERRIDE_MAX_SESSIONS: false
          SE_NODE_SESSION_TIMEOUT: 300
          SE_NODE_GRID_URL: http://localhost:4444
          SE_SCREEN_WIDTH: 1920
          SE_SCREEN_HEIGHT: 1080
          SE_VNC_NO_PASSWORD: 1
          SE_OPTS: --log-level INFO
        options: >-
          --shm-size=2gb
          --health-cmd "curl -f http://localhost:5555/status || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare package manager
        run: |
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            corepack prepare pnpm@${{ inputs.package-manager-version }} --activate
          elif [ "${{ inputs.package-manager }}" = "yarn" ]; then
            corepack prepare yarn@${{ inputs.package-manager-version }} --activate
          elif [ "${{ inputs.package-manager }}" = "npm" ] && [ -n "${{ inputs.package-manager-version }}" ]; then
            corepack prepare npm@${{ inputs.package-manager-version }} --activate
          fi

      - name: Install dependencies
        working-directory: ${{ inputs.fixture }}
        run: |
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm install
          elif [ "${{ inputs.package-manager }}" = "yarn" ]; then
            yarn install
          else
            npm install
          fi

      - name: Compute artifact paths
        id: paths
        run: |
          suffix=""
          if [ -n "${{ inputs.artifact-suffix }}" ]; then
            suffix="-${{ inputs.artifact-suffix }}"
          fi

          report_dir="${{ github.workspace }}/${{ inputs.fixture }}/${{ inputs.creevey-report-dir }}"

          echo "report_dir=${report_dir}" >> "$GITHUB_OUTPUT"
          echo "junit_xml=${report_dir}/junit.xml" >> "$GITHUB_OUTPUT"
          echo "report_artifact=creevey-report-${{ inputs.fixture }}${suffix}" >> "$GITHUB_OUTPUT"
          echo "junit_xml_artifact=junit-xml-${{ inputs.fixture }}${suffix}" >> "$GITHUB_OUTPUT"
          echo "junit_report_artifact=junit-report-${{ inputs.fixture }}${suffix}" >> "$GITHUB_OUTPUT"

      - name: Introduce expected screenshot mismatch
        if: ${{ inputs.inject-button-mismatch }}
        working-directory: ${{ inputs.fixture }}
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("stories/Button.stories.js")
          content = path.read_text()
          original = 'label: "Button",'
          updated = 'label: "Button FAIL",'
          if original not in content:
              raise SystemExit("Unable to locate the Primary story label")
          path.write_text(content.replace(original, updated, 1))
          PY

      - name: Build Storybook
        working-directory: ${{ inputs.fixture }}
        run: |
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm run build-storybook
          elif [ "${{ inputs.package-manager }}" = "yarn" ]; then
            yarn build-storybook
          else
            npm run build-storybook
          fi

      - name: Start Storybook server
        working-directory: ${{ inputs.fixture }}
        run: |
          npx http-server ./storybook-static -p 6006 -s &
          npx wait-on http://localhost:6006 --timeout 30000

      - name: Run Creevey tests
        id: creevey
        working-directory: ${{ inputs.fixture }}
        env:
          SELENIUM_GRID_URL: http://localhost:4444/wd/hub
          STORYBOOK_URL: http://localhost:6006
          CREEVEY_EXTRA_ARGS: ${{ inputs.creevey-extra-args }}
        run: |
          run_creevey() {
            if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
              pnpm run creevey ${CREEVEY_EXTRA_ARGS}
            elif [ "${{ inputs.package-manager }}" = "yarn" ]; then
              yarn creevey ${CREEVEY_EXTRA_ARGS}
            else
              npm run creevey -- ${CREEVEY_EXTRA_ARGS}
            fi
          }

          if [ "${{ inputs.capture-creevey-exit-code }}" = "true" ]; then
            set +e
            run_creevey
            exit_code=$?
            echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          run_creevey
          echo "exit_code=0" >> "$GITHUB_OUTPUT"

      - name: Assert JUnit XML
        if: ${{ inputs.junit-scenario != '' }}
        env:
          EXIT_CODE: ${{ steps.creevey.outputs.exit_code }}
          SCENARIO: ${{ inputs.junit-scenario }}
          SUMMARY_LABEL: ${{ inputs.junit-summary-label }}
          JUNIT_XML: ${{ steps.paths.outputs.junit_xml }}
        run: python ${{ github.workspace }}/scripts/validate-junit-report.py

      - name: Upload JUnit XML artifact
        if: ${{ always() && inputs.junit-scenario != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.paths.outputs.junit_xml_artifact }}
          path: ${{ steps.paths.outputs.junit_xml }}
          retention-days: 7

      - name: Upload JUnit report artifact
        if: ${{ always() && inputs.junit-scenario != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.paths.outputs.junit_report_artifact }}
          path: ${{ steps.paths.outputs.report_dir }}
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.paths.outputs.report_artifact }}
          path: ${{ steps.paths.outputs.report_dir }}
          retention-days: 7
