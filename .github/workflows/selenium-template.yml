name: Selenium Test Template

on:
  workflow_call:
    inputs:
      fixture:
        required: true
        type: string
        description: 'Project directory name'
      node-version:
        required: true
        type: string
        description: 'Node.js version (20, 22, or 24)'
      package-manager:
        required: true
        type: string
        description: 'Package manager (npm, pnpm, yarn)'
      package-manager-version:
        required: false
        type: string
        description: 'Package manager version (e.g., 10.9.7, 9.15.9, 4.13.0)'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      selenium-hub:
        image: selenium/hub:4.28.0-20250120
        ports:
          - 4444:4444
          - 4442:4442
          - 4443:4443
        options: >-
          --health-cmd "curl -f http://localhost:4444/wd/hub/status || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      selenium-node-chrome:
        image: selenium/node-chrome:4.28.0-20250120
        env:
          SE_EVENT_BUS_HOST: selenium-hub
          SE_EVENT_BUS_PUBLISH_PORT: 4442
          SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
          SE_NODE_MAX_SESSIONS: 4
          SE_NODE_SESSION_TIMEOUT: 300
          SCREEN_WIDTH: 1920
          SCREEN_HEIGHT: 1080
        options: >-
          --shm-size=2gb
          --health-cmd "curl -f http://localhost:5555/status || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare package manager
        run: |
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            corepack prepare pnpm@${{ inputs.package-manager-version }} --activate
          elif [ "${{ inputs.package-manager }}" = "yarn" ]; then
            corepack prepare yarn@${{ inputs.package-manager-version }} --activate
          elif [ "${{ inputs.package-manager }}" = "npm" ] && [ -n "${{ inputs.package-manager-version }}" ]; then
            corepack prepare npm@${{ inputs.package-manager-version }} --activate
          fi

      - name: Install dependencies
        working-directory: ${{ inputs.fixture }}
        run: |
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm install
          elif [ "${{ inputs.package-manager }}" = "yarn" ]; then
            yarn install
          else
            npm install
          fi

      - name: Build Storybook
        working-directory: ${{ inputs.fixture }}
        run: |
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm run build-storybook
          elif [ "${{ inputs.package-manager }}" = "yarn" ]; then
            yarn build-storybook
          else
            npm run build-storybook
          fi

      - name: Start Storybook server
        working-directory: ${{ inputs.fixture }}
        run: |
          npx http-server ./storybook-static -p 6006 -s &
          npx wait-on http://localhost:6006 --timeout 30000

      - name: Run Creevey tests
        working-directory: ${{ inputs.fixture }}
        env:
          SELENIUM_GRID_URL: http://localhost:4444/wd/hub
        run: |
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm exec creevey --debug
          elif [ "${{ inputs.package-manager }}" = "yarn" ]; then
            yarn creevey --debug
          else
            npx creevey --debug
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creevey-report-${{ inputs.fixture }}
          path: ${{ inputs.fixture }}/report
          retention-days: 7
