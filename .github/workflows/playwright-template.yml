name: Playwright Test Template

on:
  workflow_call:
    inputs:
      fixture:
        required: true
        type: string
        description: 'Project directory name'
      runtime:
        required: true
        type: string
        description: 'Runtime (node or bun)'
      node-version:
        required: false
        type: string
        description: 'Node.js version'
      package-manager:
        required: false
        type: string
        default: npm
        description: 'Package manager for Node.js runs'
      package-manager-version:
        required: false
        type: string
        description: 'Package manager version for Node.js runs'
      bun-version:
        required: false
        type: string
        description: 'Bun version'
      creevey-extra-args:
        required: false
        type: string
        default: ''
        description: 'Additional arguments to pass to the creevey script'
      creevey-report-dir:
        required: false
        type: string
        default: 'report'
        description: 'Report directory to upload after the run'
      capture-creevey-exit-code:
        required: false
        type: boolean
        default: false
        description: 'Capture Creevey exit code without failing the step'
      junit-scenario:
        required: false
        type: string
        default: ''
        description: 'Expected JUnit scenario for XML validation'
      junit-summary-label:
        required: false
        type: string
        default: ''
        description: 'Summary label for JUnit validation output'
      inject-button-mismatch:
        required: false
        type: boolean
        default: false
        description: 'Change the Button story label to force a mismatch'
      artifact-suffix:
        required: false
        type: string
        default: ''
        description: 'Suffix appended to uploaded artifact names'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: inputs.runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install unzip for Bun setup
        if: inputs.runtime == 'bun'
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Setup Bun
        if: inputs.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: Enable Corepack (Node)
        if: inputs.runtime == 'node'
        run: corepack enable

      - name: Prepare package manager (Node)
        if: inputs.runtime == 'node'
        run: corepack prepare ${{ inputs.package-manager }}@${{ inputs.package-manager-version }} --activate

      - name: Install dependencies (Node)
        if: inputs.runtime == 'node'
        working-directory: ${{ inputs.fixture }}
        run: npm install

      - name: Install dependencies (Bun)
        if: inputs.runtime == 'bun'
        working-directory: ${{ inputs.fixture }}
        run: bun install

      - name: Compute artifact paths
        id: paths
        run: |
          suffix=""
          if [ -n "${{ inputs.artifact-suffix }}" ]; then
            suffix="-${{ inputs.artifact-suffix }}"
          fi

          report_dir="${{ github.workspace }}/${{ inputs.fixture }}/${{ inputs.creevey-report-dir }}"

          echo "report_dir=${report_dir}" >> "$GITHUB_OUTPUT"
          echo "junit_xml=${report_dir}/junit.xml" >> "$GITHUB_OUTPUT"
          echo "report_artifact=creevey-report-${{ inputs.fixture }}${suffix}" >> "$GITHUB_OUTPUT"
          echo "junit_xml_artifact=junit-xml-${{ inputs.fixture }}${suffix}" >> "$GITHUB_OUTPUT"
          echo "junit_report_artifact=junit-report-${{ inputs.fixture }}${suffix}" >> "$GITHUB_OUTPUT"

      - name: Introduce expected screenshot mismatch
        if: ${{ inputs.inject-button-mismatch }}
        working-directory: ${{ inputs.fixture }}
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("stories/Button.stories.js")
          content = path.read_text()
          original = 'label: "Button",'
          updated = 'label: "Button FAIL",'
          if original not in content:
              raise SystemExit("Unable to locate the Primary story label")
          path.write_text(content.replace(original, updated, 1))
          PY

      - name: Build Storybook (Node)
        if: inputs.runtime == 'node'
        working-directory: ${{ inputs.fixture }}
        run: npm run build-storybook

      - name: Build Storybook (Bun)
        if: inputs.runtime == 'bun'
        working-directory: ${{ inputs.fixture }}
        run: bun run build-storybook

      - name: Start Storybook server (Node)
        if: inputs.runtime == 'node'
        working-directory: ${{ inputs.fixture }}
        run: |
          npx http-server ./storybook-static -p 6006 -s &
          npx wait-on http://localhost:6006 --timeout 30000

      - name: Start Storybook server (Bun)
        if: inputs.runtime == 'bun'
        working-directory: ${{ inputs.fixture }}
        run: |
          bunx http-server ./storybook-static -p 6006 -s &
          bunx wait-on http://localhost:6006 --timeout 30000

      - name: Run Creevey tests (Node)
        if: inputs.runtime == 'node'
        id: creevey-node
        working-directory: ${{ inputs.fixture }}
        env:
          STORYBOOK_URL: http://localhost:6006
          CREEVEY_EXTRA_ARGS: ${{ inputs.creevey-extra-args }}
        run: |
          if [ "${{ inputs.capture-creevey-exit-code }}" = "true" ]; then
            set +e
            npm run creevey -- ${CREEVEY_EXTRA_ARGS}
            exit_code=$?
            echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          npm run creevey -- ${CREEVEY_EXTRA_ARGS}
          echo "exit_code=0" >> "$GITHUB_OUTPUT"

      - name: Run Creevey tests (Bun)
        if: inputs.runtime == 'bun'
        id: creevey-bun
        working-directory: ${{ inputs.fixture }}
        env:
          STORYBOOK_URL: http://localhost:6006
          CREEVEY_EXTRA_ARGS: ${{ inputs.creevey-extra-args }}
        run: |
          if [ "${{ inputs.capture-creevey-exit-code }}" = "true" ]; then
            set +e
            bun run creevey ${CREEVEY_EXTRA_ARGS}
            exit_code=$?
            echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          bun run creevey ${CREEVEY_EXTRA_ARGS}
          echo "exit_code=0" >> "$GITHUB_OUTPUT"

      - name: Assert JUnit XML
        if: ${{ inputs.junit-scenario != '' }}
        env:
          EXIT_CODE: ${{ steps.creevey-node.outputs.exit_code || steps.creevey-bun.outputs.exit_code }}
          SCENARIO: ${{ inputs.junit-scenario }}
          SUMMARY_LABEL: ${{ inputs.junit-summary-label }}
          JUNIT_XML: ${{ steps.paths.outputs.junit_xml }}
        run: python ${{ github.workspace }}/scripts/validate-junit-report.py

      - name: Upload JUnit XML artifact
        if: ${{ always() && inputs.junit-scenario != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.paths.outputs.junit_xml_artifact }}
          path: ${{ steps.paths.outputs.junit_xml }}
          retention-days: 7

      - name: Upload JUnit report artifact
        if: ${{ always() && inputs.junit-scenario != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.paths.outputs.junit_report_artifact }}
          path: ${{ steps.paths.outputs.report_dir }}
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.paths.outputs.report_artifact }}
          path: ${{ steps.paths.outputs.report_dir }}
          retention-days: 7
