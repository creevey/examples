name: Creevey Screenshot Tests - Playwright

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:

jobs:
  playwright-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Node.js + Playwright projects
          - fixture: playwright-esm-vite-sb9
            node-version: '22'
            runtime: node
            package-manager: npm
            package-manager-version: '10.9.7'
          - fixture: playwright-esm-vite-sb10-react19
            node-version: '24'
            runtime: node
            package-manager: npm
            package-manager-version: '10.9.7'
          # Bun + Playwright project
          - fixture: playwright-esm-vite-sb10-bun
            bun-version: '1.3.11'
            runtime: bun

    uses: ./.github/workflows/playwright-template.yml
    with:
      fixture: ${{ matrix.fixture }}
      runtime: ${{ matrix.runtime }}
      node-version: ${{ matrix.node-version || '' }}
      package-manager: ${{ matrix.package-manager || 'npm' }}
      package-manager-version: ${{ matrix.package-manager-version || '' }}
      bun-version: ${{ matrix.bun-version || '' }}
