name: JUnit Reporter CI Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selenium-junit:
    name: Selenium JUnit (${{ matrix.scenario }})
    strategy:
      fail-fast: false
      matrix:
        scenario: [pass, fail]
    uses: ./.github/workflows/selenium-template.yml
    with:
      fixture: esm-vite-sb9
      node-version: '22'
      package-manager: npm
      package-manager-version: '10.9.7'
      creevey-extra-args: --reporter junit --report-dir report/junit-ci/${{ matrix.scenario }}
      creevey-report-dir: report/junit-ci/${{ matrix.scenario }}
      capture-creevey-exit-code: true
      junit-scenario: ${{ matrix.scenario }}
      junit-summary-label: Selenium JUnit
      inject-button-mismatch: ${{ matrix.scenario == 'fail' }}
      artifact-suffix: selenium-${{ matrix.scenario }}

  playwright-junit:
    name: Playwright JUnit (${{ matrix.scenario }})
    strategy:
      fail-fast: false
      matrix:
        scenario: [pass, fail]
    uses: ./.github/workflows/playwright-template.yml
    with:
      fixture: playwright-esm-vite-sb9
      runtime: node
      node-version: '22'
      package-manager: npm
      package-manager-version: '10.9.7'
      creevey-extra-args: --reporter junit --report-dir report/junit-ci/${{ matrix.scenario }}
      creevey-report-dir: report/junit-ci/${{ matrix.scenario }}
      capture-creevey-exit-code: true
      junit-scenario: ${{ matrix.scenario }}
      junit-summary-label: Playwright JUnit
      inject-button-mismatch: ${{ matrix.scenario == 'fail' }}
      artifact-suffix: playwright-${{ matrix.scenario }}
