grid:
  image: docker-proxy.kontur.host/node:20
  tags:
    - idevops-k8s-staging
  stage: test
  parallel:
    matrix:
      - FIXTURE:
          - esm
          - playwright-grid
          - vite
          - vite-sb8
          - webpack
          - webpack-sb8
          - yarn-pnp
  script:
   - cd $FIXTURE
   - yarn
   - yarn creevey -s --debug
  artifacts:
    paths:
      - $FIXTURE/report

local:
  image: docker-proxy.kontur.host/node:20
  tags:
    - idevops-k8s-staging
  stage: test
  variables:
    DOCKER: true
  script:
   - cd playwright-docker
   - yarn
   - yarn dlx playwright install --with-deps chromium
   - yarn creevey -s --debug
  artifacts:
    paths:
      - playwright-docker/report

docker:
  image: docker-proxy.kontur.host/node:20
  tags:
    - docker-build
  stage: test
  script:
    - cd playwright-docker
    - yarn
    - yarn creevey -s --debug
  artifacts:
    paths:
      - playwright-docker/report
